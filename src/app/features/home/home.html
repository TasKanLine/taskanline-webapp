<div class="home-root min-h-screen bg-bg-primary text-text-primary flex flex-col relative">
  <div class="fixed right-5 top-5 z-20">
    <app-theme-switcher></app-theme-switcher>
  </div>

  @if (isMobile()) {
  <button
    appButton
    class="fixed left-4 top-4 z-20 shadow-md"
    severity="primary"
    variant="raised"
    [rounded]="true"
    [icon]="Icons.Menu"
    [iconOnly]="true"
    (click)="toggleSidebar()"
    [attr.aria-expanded]="!isSidebarCollapsed()"
    [attr.aria-controls]="'app-sidebar'"
    aria-label="Toggle sidebar"
  ></button>
  }

  <app-sidebar
    id="app-sidebar"
    class="home-sidebar fixed top-0 left-0 z-30 h-full shadow-xl lg:shadow-none"
    [collapsed]="isSidebarCollapsed()"
    (toggleCollapsed)="toggleSidebar()"
    [@sidebarSlide]="sidebarAnimationState()"
  ></app-sidebar>

  <main
    class="home-main flex-1 min-h-screen flex flex-col relative z-0"
    [style.margin-left.px]="desktopMainMargin()"
    [@contentPush]="contentAnimationState()"
    (click)="onMainClick()"
  >
    @if (showWelcome()) {
    <div class="flex flex-col items-center justify-center pt-20 pb-10">
      <h1 class="text-4xl font-bold text-[var(--color-primary)]">Hello World!</h1>
    </div>
    }

    <div class="px-6 pb-6">
      <router-outlet />
    </div>
  </main>
</div>
