<div class="flex flex-col items-start justify-start fixed right-5 top-5 z-10">
  <app-theme-switcher></app-theme-switcher>
</div>

<div class="flex flex-col items-center justify-center h-screen">
  <div class="text-center">
    <h1 class="text-8xl font-bold text-rose-700">500</h1>
    <h2 class="text-3xl font-medium relative top-6">Ошибка сервера</h2>
    <p class="text-sm font-medium relative top-10">Произошла ошибка на сервере. Пожалуйста, попробуйте позже.</p>

    <div class="relative top-16">
      <a
        appButton
        severity="primary"
        variant="outlined"
        class="w-full justify-center cursor-pointer"
        [icon]="HomeIcon"
        (click)="goHome()"
      >
        Вернуться на главную
      </a>
    </div>
  </div>
</div>
