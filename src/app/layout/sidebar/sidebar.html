<div class="flex w-full h-full flex-col gap-6 px-4 py-6 overflow-x-visible overflow-y-auto">
  <div class="flex items-center gap-3 overflow-hidden whitespace-nowrap">
    <div
      class="size-9 shrink-0 rounded-xl bg-[var(--color-primary)]/15 text-[var(--color-primary)] flex items-center justify-center font-semibold"
    >
      TL
    </div>

    @if (!collapsed()) {
    <div class="leading-tight transition-opacity duration-300">
      <p class="font-bold">TasKanLine</p>
    </div>
    }
  </div>

  <nav class="flex flex-col gap-2">
    @for (item of navItems; track item.path) {
    <button
      appButton
      [iconOnly]="collapsed()"
      [justify]="collapsed() ? 'center' : 'start'"
      severity="primary"
      variant="text"
      [icon]="item.icon"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      [attr.aria-current]="isActive(item.path) ? 'page' : null"
      [attr.aria-label]="item.label"
      [title]="collapsed() ? item.label : ''"
    >
      @if (!collapsed()) {
      <span class="whitespace-nowrap overflow-hidden"> {{ item.label }} </span>
      }
    </button>
    }
  </nav>

  @if (isAuthenticated()) {
  <div class="mt-auto relative">
    <button
      #menuButton
      type="button"
      class="flex w-full items-center gap-3 rounded-xl border border-border-color bg-bg-secondary/80 px-2 py-2 text-left text-sm hover:bg-bg-secondary"
      [class.justify-center]="collapsed()"
      (click)="toggleMenu()"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-controls]="menuId"
      [attr.aria-label]="collapsed() ? menuLabel() : null"
      [title]="collapsed() ? menuLabel() : ''"
    >
      <div
        class="flex size-9 shrink-0 items-center justify-center rounded-full bg-[var(--color-initial-bg-secondary)] text-[var(--color-initial-text-secondary)] text-sm font-bold"
      >
        {{ initials() }}
      </div>

      @if (!collapsed()) {
      <span class="truncate text-text-primary flex-1">{{ displayName() }}</span>
      }
    </button>

    <div
      #menuPanel
      class="popup-menu fixed rounded-xl border border-border-color bg-bg-secondary/95 shadow-lg backdrop-blur z-50"
      [class.popup-menu--open]="menuVisible()"
      [attr.id]="menuId"
      [style.top.px]="menuPosition()?.top"
      [style.left.px]="menuPosition()?.left"
      [style.minWidth.px]="menuPosition()?.minWidth"
      [attr.aria-hidden]="!menuOpen()"
      [attr.inert]="menuOpen() ? null : true"
      role="menu"
    >
      <button
        routerLink="/profile"
        class="w-full"
        appButton
        justify="start"
        severity="primary"
        variant="text"
        [icon]="Icons.UserRound"
        role="menuitem"
        (click)="closeMenu()"
      >
        Profile
      </button>
      <button
        class="w-full"
        appButton
        justify="start"
        severity="danger"
        variant="text"
        [icon]="Icons.LogOut"
        role="menuitem"
        (click)="logout()"
      >
        Logout
      </button>
    </div>
  </div>
  }

  <div>
    <button
      class="w-full"
      appButton
      justify="start"
      severity="primary"
      variant="text"
      [icon]="collapsed() ? Icons.ChevronsRight : Icons.ChevronsLeft"
      (click)="onCollapseClick()"
      [attr.aria-label]="collapseTitle()"
      [title]="collapseTitle()"
    >
      @if (!collapsed()) {
      <span>Collapse</span>
      }
    </button>
  </div>
</div>
